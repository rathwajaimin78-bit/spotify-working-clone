<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>spotify</title>
    <link rel="stylesheet" href="style.css">



</head>

<body>


    <nav class="boder display-flex alineitme-center">
        <a href=""><img class="invert" src="asstes/spotify_logo.svg" alt=""></a>

        <div class="boder display-flex gap-10">

            <div class="icon light_black round alineitme-center display-flex justfy-center "><img src="asstes/home.svg"
                    class="invert" alt=""></div>



            <input type="text" id="search" placeholder="search"
                class="search boder  display-flex alineitme-center light_black justfy-center font-white">
        </div>




        <div class="more display-flex gap-10 boder">

            <button class="justfy-center alineitme-center display-flex button font-white black">Sing in</button>
            <button class="justfy-center alineitme-center display-flex button green ">log in</button>

        </div>
    </nav>

    <main class="display-flex">



        <aside class="left boder">


            <div class="Home boder black">
                <div class="logo boder">
                    <ul>
                        <li class="boder "><img src="asstes/home.svg" class="invert" alt="Home">Home</li>
                        <li class="boder "><img src="asstes/search.svg" class="invert" alt="search">search</li>
                    </ul>
                </div>
            </div>


            <div class="Library boder">

                <div class="logo boder">
                    <ul>
                        <li class="boder "><img src="asstes/playlist.svg" class="invert" alt="Library">Your Library</li>
                    </ul>
                </div>


                <div class="playlist">


                </div>

            </div>


            <footer>
                <div><a href="https://www.spotify.com/jp/legal/"><span>Legal</span></a></div>
                <div><a href="https://www.spotify.com/jp/privacy/"><span>Privacy Center</span></a></div>
                <div><a href="https://www.spotify.com/jp/legal/privacy-policy/"><span>Privacy Policy</span></a></div>
                <div><a href="https://www.spotify.com/jp/legal/cookies-policy/"><span>Cookies</span></a></div>
                <div><a href="https://www.spotify.com/jp/legal/privacy-policy/#s3"><span>About Ads</span></a></div>
                <div><a href="https://www.spotify.com/jp/accessibility/"><span>Accessibility</span></a></div>
            </footer>
        </aside>



        <div class="right boder">

            <div class="control">
                <img src="asstes/previous.svg" alt="">
                <img src="asstes/next.svg" alt="">
            </div>



            <div class="spofifyplaylist">
                <h1>spofify playlist </h1>

                <div class="list">

                    <div class="song_card boder">
                        <img src="asstes/playlist-img.webp" alt="">

                        <div class="info">

                            <h3 class="song_name">Never Left</h3>
                            <h5 class="artiest_name">shubh</h5>
                        </div>
                    </div>

                    <div class="song_card boder">
                        <img src="asstes/playlist-img.webp" alt="">

                        <div class="info">

                            <h3 class="song_name">Never Left</h3>
                            <h5 class="artiest_name">shubh</h5>
                        </div>
                    </div>


                </div>

            </div>

        </div>


    </main>
</body>

</html>
